<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<title>登录 · 静研自习室座位预约系统</title><link rel="stylesheet" href="mock.css"></head><body>
<div class="lg-page">
  <div class="lg-left">
    <div class="bgimg" style="background-image:url('../uploads/seed/room/01.jpg')"></div>
    <div class="mask"></div>
    <div class="lg-brand"><div class="mk">静</div><div><b>静研自习室</b><i>SEAT BOOKING &amp; STUDY TRACKING</i></div></div>
    <div>
      <h2>把座位留给<em>真正坐下来的人</em></h2>
      <p class="sub">分时段座位预约、预约码签到、学习时长客观记录与违约信用管理，
      让每一张桌子都被认真使用，让每一小时专注都有据可查。</p>
      <div class="stats">
        <div><b>8</b><span>在管自习室</span></div>
        <div><b>756</b><span>可预约座位</span></div>
        <div><b>91.4%</b><span>平均到座率</span></div>
      </div>
    </div>
    <div class="cp">© 2026 静研自习室 · 校园场馆运营中心</div>
  </div>
  <div class="lg-right">
    <form class="lg-form" onsubmit="return false">
      <h3>欢迎回来</h3>
      <div class="tip">使用学号或工号登录，首次登录请先完善个人信息</div>
      <div class="fd user"><label>账号</label><input class="inp" placeholder="学号 / 工号 / 管理员账号" value="stu2024210318"></div>
      <div class="fd pwd"><label>密码</label><input class="inp" type="password" placeholder="请输入密码" value="123456"></div>
      <div class="row"><label><input type="checkbox" checked> 记住我（7 天）</label><a>忘记密码？</a></div>
      <button class="sub-btn" type="submit">登 录</button>
      <div class="roles"><a>考研学生</a><a>自习室管理员</a><a>学工老师</a><a>运营主管</a><a>系统管理员</a></div>
      <div class="foot">登录即表示同意《自习室使用规则》与《违约处理办法》</div>
    </form>
  </div>
</div></body></html>
